name: Release Linux Bundle

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -euxo pipefail
          pacman -Syu --noconfirm --needed \
            base-devel rust cargo pkgconf clang perl git \
            gtk4 libadwaita

      - name: Build binaries
        run: |
          set -euxo pipefail
          cargo build --release --locked --bins

      - name: Create release bundle
        run: |
          set -euxo pipefail
          bundle_root="dist/windoesnot-store-linux-x86_64"
          rm -rf "$bundle_root"
          install -Dm755 target/release/windoesnot-store "$bundle_root/windoesnot-store"
          install -Dm755 target/release/windoesnot-store-helper "$bundle_root/windoesnot-store-helper"
          install -Dm644 resources/me.windoesnot.Store.desktop "$bundle_root/resources/me.windoesnot.Store.desktop"
          install -Dm644 resources/me.windoesnot.Store.metainfo.xml "$bundle_root/resources/me.windoesnot.Store.metainfo.xml"
          install -Dm644 resources/me.windoesnot.Store.policy "$bundle_root/resources/me.windoesnot.Store.policy"
          install -Dm644 LICENSE "$bundle_root/LICENSE"
          install -Dm644 README.md "$bundle_root/README.md"
          tar -C dist -czf dist/windoesnot-store-linux-x86_64.tar.gz windoesnot-store-linux-x86_64
          sha256sum dist/windoesnot-store-linux-x86_64.tar.gz > dist/windoesnot-store-linux-x86_64.tar.gz.sha256

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: windoesnot-store-linux-x86_64
          path: |
            dist/windoesnot-store-linux-x86_64.tar.gz
            dist/windoesnot-store-linux-x86_64.tar.gz.sha256

      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/windoesnot-store-linux-x86_64.tar.gz
            dist/windoesnot-store-linux-x86_64.tar.gz.sha256
          generate_release_notes: false
